services:
  jolo:
    build: .
    ports:
      # This Mac's Firestore emulator already listens on 8080. The process
      # inside the container still uses 8080; the Mac reaches it on 8090.
      - "8090:8080"
    environment:
      # Required: callers must send "Authorization: Bearer <AGENT_TOKEN>" or X-Jolo-Key.
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      JOLO_PHONE_SALT: ${JOLO_PHONE_SALT:-jolo-dev}
      # Where the Qwen model server is. Default: the SSH tunnel on this computer's port 8000.
      JOLO_MODEL_ENDPOINT: ${JOLO_MODEL_ENDPOINT:-http://host.docker.internal:8000/v1}
      # Comma list, only used on the first start: +16095550100=barbaras
      JOLO_OWNERS: ${JOLO_OWNERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The host folder already has cafes.yaml and the seeded store.
      # A named volume would hide those files on the first start.
      - ./data:/app/data
      - jolo-models:/app/models    # Hugging Face downloads
    restart: unless-stopped

volumes:
  jolo-models:
