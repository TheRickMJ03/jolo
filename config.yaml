# JOLO menu reader config.
# Pick a profile with the JOLO_PROFILE environment variable (default: vm).
# Switching between laptop and VM must only ever mean switching the profile.
#   vm          the chosen setup: Qwen3.5-9B on the VM reads the photo
#   laptop_cpu  the earlier experiments: GLM-OCR on the laptop through Ollama

default_profile: vm

# Settings shared by every profile. A profile can override any of these.
common:
  intake:
    max_side_px: 2000          # longest side after resize
    blur_threshold: null       # set in M2, from dev photos only

  ppocr:                       # PP-OCRv6, always on CPU on the laptop
    # Tiers: tiny (fastest), small, medium (most accurate, slowest on CPU).
    detection_model: PP-OCRv6_small_det
    recognition_model: PP-OCRv6_small_rec
    device: cpu
    enable_mkldnn: true        # set false if Paddle crashes with a oneDNN/MKLDNN error

  preprocess:
    # Everything is off until the M2 debug images show which steps help.
    perspective: false         # straighten the board when one clear 4-sided board is found
    invert_dark: false         # invert light-on-dark boards (chalkboards)
    clahe: false               # local contrast boost
    upscale_long_side_px: null # e.g. 2000 to enlarge small web images

  crop:
    mode: none                 # none | ppocr_boxes | sam3_cached
    min_text_score: 0.5        # ppocr_boxes: ignore text lines below this score
    margin: 0.03               # ppocr_boxes: padding, as a fraction of the image size
    sam3_cache_dir: eval/cache/crops

  reader:
    name: glm_ocr_schema       # which function in readers.py
    max_tokens: 4096           # caps a runaway reply at about 10 minutes on the laptop CPU
    structurer_max_tokens: 8192  # for the language model in two-step readers
    temperature: 0
    timeout_seconds: 1800      # CPU is slow: allow up to 30 minutes per photo

  confidence:
    # Back each item with a second read by PP-OCR on the CPU (adds its run time
    # to every photo). Off: every item gets the "unchecked" confidence 0.5.
    ppocr_check: false

  eval:
    name_match_threshold: 85   # RapidFuzz token_set_ratio

  # ---------- The agent (Bhavesh). The menu reader ignores this section. ----------
  agent:
    endpoint: null             # null = the profile's endpoint (the same vLLM server as the reader)
    model: qwen3.5-9b
    # How the agent asks the model for tool calls:
    #   native  OpenAI "tools" (vLLM needs --enable-auto-tool-choice and --tool-call-parser)
    #   json    the model writes one JSON action as plain text; works on any server
    #   auto    try native, fall back to json when the server refuses tools
    # json: with the server's native tool calling on (qwen3_coder parser), the 30
    # scripted conversations scored 19/30; in json mode 26/30 (agent_eval/run_conversations.py).
    tool_mode: json
    temperature: 0
    max_tokens: 700
    timeout_seconds: 120
    max_tool_rounds: 5         # model -> tools -> model ... at most this many times per message
    history_turns: 6           # earlier messages kept per phone number
    timezone: America/New_York # for "open now"

    store:
      backend: memory          # memory (a JSON file) | firestore
      path: data/store.json    # memory backend only; in .gitignore
      firestore_credentials_env: GOOGLE_APPLICATION_CREDENTIALS   # path to the service-account key
    # Phone numbers are stored as salted hashes; the salt is JOLO_PHONE_SALT in .env.

    api:
      host: 127.0.0.1          # 0.0.0.0 to let Isaiah's Mac reach it; then set JOLO_API_KEY
      port: 8080               # 8000 is the SSH tunnel to the model server
      callback_url: null       # late replies are POSTed here; null = Isaiah polls GET /outbox
      api_key_env: JOLO_API_KEY
      token_env: AGENT_TOKEN   # the bridge sends this as "Authorization: Bearer ..." (blank = no check)
      turn_timeout_seconds: 280   # POST /v1/turn waits this long for a photo read; the bridge gives up at 300
      turn_poll_seconds: 0.5
      rate_limit_messages: 30          # per sender, per window; over it: HTTP 429
      rate_limit_window_seconds: 60
      rate_limit_photos: 12            # photos per sender per hour (each costs a model read)
      rate_limit_photo_window_seconds: 3600

    reads:
      workers: 2               # menu photos read at the same time

    confirm:
      items_per_message: 5     # how many items the owner is asked to check at once
      name_match_threshold: 80 # RapidFuzz: how close an owner's wording must be to an item name

    search:
      index_dir: data/index    # LanceDB files; in .gitignore
      models_dir: models/hf    # Hugging Face downloads go here, not to the C: drive
      embedding_model: Qwen/Qwen3-Embedding-0.6B
      reranker_model: Qwen/Qwen3-Reranker-0.6B
      rebuild_on_start: true   # rebuild from the store at startup (unchanged texts keep their vectors); Firestore is also edited by the app
      refresh_seconds: 60      # check for menus edited elsewhere (the app) this often and re-index them; 0 = off
      use_embeddings: true     # false = keyword search (BM25) only
      use_reranker: true
      device: cpu              # cpu | cuda | auto. cuda is for a host with a GPU, the VM; measure with agent_eval/run_search_eval.py --device cuda
      rerank_min_words: 1      # skip the reranker for queries shorter than this; 2 = one-word queries use the ranking as it is
      candidates: 50           # hits kept from keyword + vector search
      rerank_top: 8            # cafés the reranker scores; about 0.4 s each on a laptop CPU
      results: 5               # cafés handed to the agent
      max_miles: 5.0           # "within distance" when the customer gives a place
      bandit:
        enabled: false         # Thompson sampling on top of the ranking; on in the simulation
        weight: 0.15

profiles:
  laptop_cpu:
    # Ollama's OpenAI-compatible endpoint.
    endpoint: http://localhost:11434/v1
    models:
      glm_ocr: glm-ocr-jolo    # built from scripts/ollama/Modelfile.glm-ocr
      # The language model that turns transcribed text into our schema
      # (reader glm_ocr_then_structure): Qwen3.5-9B served by vLLM on the VM,
      # reached through the SSH tunnel (ssh -N -L 8000:localhost:8000 ...).
      # The VM must be running and the tunnel open, or this reader reports
      # a model_error.
      structurer:
        name: qwen3.5-9b       # the --served-model-name in scripts/vm/serve_qwen.sh
        endpoint: http://localhost:8000/v1

  vm:
    # The setup chosen from the dev results: Qwen3.5-9B reads the photo itself.
    # vLLM on the VM (scripts/vm/serve_qwen_vision.sh), reached through:
    #   ssh -N -L 8000:localhost:8000 ...
    endpoint: http://localhost:8000/v1
    reader:
      name: qwen_photo_lines
    preprocess:
      upscale_long_side_px: 2000   # small web images read much better enlarged
    confidence:
      ppocr_check: true
    models:
      glm_ocr: glm-ocr         # the --served-model-name from GLM-OCR's README
      structurer: qwen3.5-9b
      qwen_vision: qwen3.5-9b  # same server, started with scripts/vm/serve_qwen_vision.sh
      # The other served model names are filled in at M5.
