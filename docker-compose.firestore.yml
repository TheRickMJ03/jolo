# Run the brain against the shared Firestore database (project jolo-ec76d) instead of the local JSON store:
#
#   docker compose -f docker-compose.yml -f docker-compose.firestore.yml up -d --build
#
# Needs FIREBASE_KEY_FILE in .env: the full path of the service-account key on THIS computer
# (never commit the key). The key is mounted read-only into the container.
services:
  jolo:
    environment:
      JOLO_STORE_BACKEND: firestore
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/key.json
      GOOGLE_CLOUD_PROJECT: jolo-ec76d
    volumes:
      - ${FIREBASE_KEY_FILE:?set FIREBASE_KEY_FILE in .env}:/secrets/key.json:ro
