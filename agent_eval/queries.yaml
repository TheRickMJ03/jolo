# 50 search queries with graded relevance, for agent_eval/run_search_eval.py.
#
# Grades: 3 = exactly what was asked for, 2 = a good answer, 1 = partly relevant.
# A café that is not listed has grade 0.
#
# How these were labelled: by reading each café's item list (eval/ground_truth.csv)
# and its invented vibe and summary (data/cafes.yaml). One pass, not double-checked,
# and labelled by the same person who built the search, so treat the numbers as a
# development aid. The vibe queries (41 to 50) are judged against demo data that
# was made up, so they only show that the search can use such text.

queries:
